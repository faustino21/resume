# Cache policy by URI. Kept in one map so a single server-level add_header
# emits it: nginx add_header in a location REPLACES all inherited ones, which
# would silently drop the security headers below.
map $uri $cache_control {
	default                                  "public, max-age=0, must-revalidate";
	# Astro emits content-hashed assets here — safe to pin forever.
	~^/_astro/                               "public, max-age=31536000, immutable";
	~^/fonts/                                "public, max-age=31536000, immutable";
	~*\.(png|jpe?g|gif|webp|avif|svg|ico)$   "public, max-age=2592000";
}

server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;
	server_tokens off;

	# --- headers (server level only, see map comment) ---
	add_header Cache-Control $cache_control always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# --- compression ---
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/plain text/css text/xml text/javascript
		application/javascript application/json application/xml
		application/rss+xml application/atom+xml
		image/svg+xml font/woff font/woff2;

	location /_astro/ {
		access_log off;
		try_files $uri =404;
	}

	location /fonts/ {
		access_log off;
		try_files $uri =404;
	}

	# Astro builds directory-style URLs: /blog/post/ -> /blog/post/index.html
	location / {
		try_files $uri $uri/index.html $uri/ =404;
	}

	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location ~ /\. {
		deny all;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
	}
}
