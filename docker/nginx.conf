server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	charset utf-8;
	server_tokens off;

	# --- security headers ---
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# --- compression ---
	gzip on;
	gzip_vary on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_types
		text/plain text/css text/xml text/javascript
		application/javascript application/json application/xml
		application/rss+xml application/atom+xml
		image/svg+xml font/woff font/woff2;

	# Astro emits content-hashed assets in /_astro — immutable forever.
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		access_log off;
		try_files $uri =404;
	}

	location /fonts/ {
		expires 1y;
		add_header Cache-Control "public, immutable" always;
		access_log off;
		try_files $uri =404;
	}

	location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
		expires 30d;
		add_header Cache-Control "public" always;
		access_log off;
		try_files $uri =404;
	}

	# HTML + feeds: always revalidate so deploys land immediately.
	location ~* \.(html|xml|json|txt)$ {
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
		try_files $uri =404;
	}

	# Astro builds directory-style URLs: /blog/post/ -> /blog/post/index.html
	location / {
		try_files $uri $uri/index.html $uri/ =404;
	}

	location = /health {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	location ~ /\. {
		deny all;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
	}
}
